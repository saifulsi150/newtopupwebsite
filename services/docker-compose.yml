version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: tast_nginx
    depends_on:
      - app
      - nuxt
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - tast_net

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tast_app
    working_dir: /var/www
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks:
      - tast_net

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tast_queue
    working_dir: /var/www
    command: sh -c "php artisan queue:work $${QUEUE_CONNECTION:-redis} --queue=default --sleep=1 --tries=3 --timeout=120"
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    depends_on:
      - app
      - redis
    restart: unless-stopped
    networks:
      - tast_net

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tast_scheduler
    working_dir: /var/www
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - tast_net

  mysql:
    image: mysql:8.4
    container_name: tast_mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: topup_db_tast_ffuid
      MYSQL_USER: topup_user_1091
      MYSQL_PASSWORD: topup_password_change_me
      MYSQL_ROOT_PASSWORD: root_password_change_me
    ports:
      - "3307:3306"
    volumes:
      - tast_mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - tast_net

  redis:
    image: redis:7.4-alpine
    container_name: tast_redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - tast_redis_data:/data
    restart: unless-stopped
    networks:
      - tast_net

  nuxt:
    build:
      context: ./frontend-legacy-nuxt
      dockerfile: Dockerfile
    container_name: tast_nuxt
    env_file:
      - ./frontend-legacy-nuxt/.env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - tast_net

volumes:
  tast_mysql_data:
  tast_redis_data:

networks:
  tast_net:
    driver: bridge
